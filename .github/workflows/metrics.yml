name: Metrics

on:
  schedule: [{cron: "0 6 * * *"}] # каждый день в 6:00 UTC
  workflow_dispatch:              # кнопка "Run workflow" вручную
  push: {branches: [main]}

permissions:
  contents: write                 # чтобы Action мог закоммитить SVG-карточки

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Общая статистика — аналог github-readme-stats (?username=...)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Akior
          filename: stats.svg
          base: header, activity, repositories
          config_timezone: Europe/Moscow

          # Открытые issues/PR по репозиториям
          plugin_followup: yes
          plugin_followup_sections: repositories

          # Изометрический календарь коммитов за год
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Языки — аналог top-langs (compact)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Akior
          filename: languages.svg
          base: ""
          config_timezone: Europe/Moscow
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github

      # Достижения (plugin_achievements) отключены: GitHub API удалил поля
      # Projects (classic) из GraphQL — плагин неизлечимо падает с
      # "Unexpected error". Живой аналог трофеев — plugin_notable ниже.

      # Крупные вклады в чужие репозитории
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Akior
          filename: notable.svg
          base: ""
          config_timezone: Europe/Moscow
          plugin_notable: yes
          plugin_notable_filter: stars:>10
          plugin_notable_types: commit
